name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: jurisrag_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jurisrag_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: jurisrag_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      MLFLOW_TRACKING_URI: file:///tmp/jurisrag-mlruns
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --all-groups

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Run unit and PostgreSQL integration tests
        run: uv run pytest -q
