[project]
name = "jurisrag_arabic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ahmed-Almakki", email = "ahmedlmakkii@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bentoml>=1.4.39",
    "dotenv>=0.9.9",
    "dvc-gdrive>=3.0.1",
    "dvc[gdrive,s3]>=3.67.1",
    "huggingface-hub>=2.2.0",
    "langchain>=1.4.4",
    "langchain-community==0.4.1",
    "langchain-core>=1.6.10",
    "langchain-groq>=1.1.3",
    "pdfplumber>=0.11.10",
    "psycopg2-binary>=2.9.13",
    "pyyaml>=6.0.2",
    "ragas>=0.4.3",
]


[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that use external services such as PostgreSQL",
]

[dependency-groups]
dev = [
    "arabic-reshaper>=3.0.1",
    "mlflow>=3.17.0",
    "pandas>=3.0.6",
    "pre-commit>=4.6.2",
    "locust>=2.43.1",
    "pytest>=9.1.1",
    "python-bidi>=0.6.11",
    "ruff>=0.16.10",
]
