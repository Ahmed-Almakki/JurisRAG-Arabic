[project]
name = "jurisrag_arabic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ahmed-Almakki", email = "ahmedlmakkii@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bentoml>=1.4.39",
    "dotenv>=0.9.9",
    "huggingface-hub>=2.2.0",
    "langchain>=1.4.4",
    "langchain-core>=1.6.10",
    "langchain-groq>=1.1.3",
    "mlflow>=3.17.0",
    "psycopg2-binary>=2.9.13",
    "pyyaml>=6.0.2",
]


[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "arabic-reshaper>=3.0.1",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "python-bidi>=0.6.11",
    "ruff>=0.16.10",
]
