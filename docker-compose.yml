x-jurisrag-app: &jurisrag-app
  build:
    context: .
    dockerfile: Dockerfile
  image: jurisrag-arabic:local
  env_file:
    - .env
  environment:
    DB_HOST: jurisage-db
    DB_PORT: "5432"
    DB_NAME: ${DB_NAME:-jurisrag_db}
    DB_USER: ${DB_USER:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    GROQ_API_KEY: ${GROQ_API_KEY_RAG:?Set GROQ_API_KEY_RAG in .env}
  volumes:
    - ./models/bge-m3:/app/models/bge-m3:ro
    - ./data/raw:/app/data/raw:ro
    - ./data/processed:/app/data/processed
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  networks:
    - jurisage-network
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: jurisage-db
    environment:
      POSTGRES_DB: ${DB_NAME:-jurisage_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-jurisage_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jurisage-network
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI:?Set MLFLOW_BACKEND_STORE_URI in .env}
    command:
      [
        "mlflow",
        "server",
        "--backend-store-uri",
        "${MLFLOW_BACKEND_STORE_URI}",
        "--default-artifact-root",
        "/mlflow/artifacts",
        "--artifacts-destination",
        "/mlflow/artifacts",
        "--serve-artifacts",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
        "--allowed-hosts",
        "*",
      ]
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jurisage-network
    restart: unless-stopped

  ingestion:
    <<: *jurisrag-app
    command: ["python", "-m", "jurisrag_arabic.ingestion.process_docs"]
    profiles: ["ingestion"]

  rag:
    <<: *jurisrag-app
    command:
      [
        "bentoml",
        "serve",
        "jurisrag_arabic.rag:RAG",
        "--host",
        "0.0.0.0",
        "--port",
        "3000",
      ]
    ports:
      - "127.0.0.1:${RAG_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/livez', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    command:
      - '--web.enable-remote-write-receiver'
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - jurisage-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --tries=1 -O- http://localhost:9090/-/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - jurisage-network
    restart: unless-stopped

  nodeexporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - jurisage-network

volumes:
  pg_data:
    name: pg_data
  mlflow_artifacts:
    name: mlflow-artifacts
  grafana-data:
    name: grafana-data
  prometheus_data:
    name: prometheus_data

networks:
  jurisage-network:
    name: jurisage-network