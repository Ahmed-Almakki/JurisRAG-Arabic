x-jurisrag-app: &jurisrag-app
  build:
    context: .
    dockerfile: Dockerfile
  image: jurisrag-arabic:local
  env_file:
    - .env
  environment:
    DB_HOST: jurisage-db
    DB_PORT: "5432"
    DB_NAME: ${DB_NAME:-jurisrag_db}
    DB_USER: ${DB_USER:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    GROQ_API_KEY: ${GROQ_API_KEY_RAG:?Set GROQ_API_KEY_RAG in .env}
  volumes:
    - ./models/bge-m3:/app/models/bge-m3:ro
    - ./data/raw:/app/data/raw:ro
    - ./data/processed:/app/data/processed
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  networks:
    - jurisage-network
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: jurisage-db
    environment:
      POSTGRES_DB: ${DB_NAME:-jurisage_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-jurisage_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jurisage-network
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI:?Set MLFLOW_BACKEND_STORE_URI in .env}
    command:
      ["mlflow", "server", "--backend-store-uri", "${MLFLOW_BACKEND_STORE_URI}", "--default-artifact-root",
        "/mlflow/artifacts", "--artifacts-destination", "/mlflow/artifacts", "--serve-artifacts",
        "--host", "0.0.0.0", "--port", "5000", "--allowed-hosts", "*",
      ]
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jurisage-network
    restart: unless-stopped

  ingestion:
    <<: *jurisrag-app
    command: ["python", "-m", "jurisrag_arabic.ingestion.process_docs"]
    profiles: ["ingestion"]

  rag:
    <<: *jurisrag-app
    command:
      ["bentoml", "serve","jurisrag_arabic.rag:RAG", "--host", "0.0.0.0", "--port", "3000",]
    ports:
      - "127.0.0.1:${RAG_PORT:-3000}:3000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/livez', timeout=4)",]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  pg_data:
    name: pg_data
  mlflow_artifacts:
    name: mlflow-artifacts

networks:
  jurisage-network:
    name: jurisage-network
